[project]
name = "bench"
version = "0.1.0"
description = ""
authors = [
    {name = "RodionSOK",email = "socoljv_ev@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.5.0,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)"
]


[project.scripts]
bench = "cli.main:main"

[tool.poetry]
packages = [{include = "src"}, {include = "cli"}]

[tool.poetry.group.dev.dependencies]
pyinstaller = {version = ">=6.21.0", python = ">=3.13,<3.16"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
